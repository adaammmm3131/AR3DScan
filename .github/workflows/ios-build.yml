name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build AR3DScan iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: List available simulators
        run: xcrun simctl list devices available
      
      - name: Build project
        run: |
          cd AR3DScan
          mkdir -p build
          xcodebuild -project AR3DScan.xcodeproj \
            -scheme AR3DScan \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -sdk iphonesimulator \
            -derivedDataPath ./build \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      
      - name: Find and prepare build artifacts
        if: success()
        run: |
          cd AR3DScan
          echo "Searching for AR3DScan.app..."
          
          # Chercher dans le rÃ©pertoire build spÃ©cifiÃ©
          if [ -d "build/Build/Products/Debug-iphonesimulator/AR3DScan.app" ]; then
            echo "Found app in build directory"
            APP_PATH="build/Build/Products/Debug-iphonesimulator/AR3DScan.app"
          else
            # Chercher dans DerivedData par dÃ©faut
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AR3DScan.app" -type d 2>/dev/null | grep -i "Debug-iphonesimulator" | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "Found app in DerivedData: $APP_PATH"
            else
              echo "ERROR: AR3DScan.app not found!"
              echo "Checking build directory structure:"
              find build -type d -name "*Products*" 2>/dev/null || echo "No Products directory found"
              find build -name "*.app" -type d 2>/dev/null || echo "No .app files found"
              exit 1
            fi
          fi
          
          # Copier vers un emplacement standard pour l'upload
          mkdir -p ./artifacts
          cp -R "$APP_PATH" ./artifacts/AR3DScan.app
          echo "Artifact ready at: $(pwd)/artifacts/AR3DScan.app"
          ls -la ./artifacts/
      
      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: AR3DScan/artifacts/AR3DScan.app
          retention-days: 7
