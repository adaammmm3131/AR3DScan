name: Build iOS App for Device

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'AR3DScan/**'

jobs:
  build-device:
    name: Build AR3DScan for iPhone Device
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      
      - name: Build for iOS Device
        run: |
          cd AR3DScan
          mkdir -p build
          
          # Build pour appareil réel (pas simulateur)
          xcodebuild -project AR3DScan.xcodeproj \
            -scheme AR3DScan \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      
      - name: Create IPA package
        if: success()
        run: |
          cd AR3DScan
          
          # Trouver l'app buildée
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "AR3DScan.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: AR3DScan.app not found!"
            find build -name "*.app" -type d 2>/dev/null || echo "No .app files found"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Créer le répertoire Payload (structure IPA)
          mkdir -p ./artifacts/Payload
          cp -R "$APP_PATH" ./artifacts/Payload/AR3DScan.app
          
          # Créer l'IPA
          cd artifacts
          zip -r ../AR3DScan.ipa Payload
          cd ..
          
          echo "IPA created at: $(pwd)/AR3DScan.ipa"
          ls -lh AR3DScan.ipa
      
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AR3DScan-iOS-Device-IPA
          path: AR3DScan/AR3DScan.ipa
          retention-days: 30

